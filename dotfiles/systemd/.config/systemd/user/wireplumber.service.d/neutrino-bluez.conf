# Neutrino - wait for BlueZ before starting WirePlumber
#
# WirePlumber's bluez5 monitor probes for BlueZ once at startup and, if the
# system service isn't up yet, logs
#
#   spa.bluez5: BlueZ system service is not available
#
# and never retries. It then registers no A2DP endpoints for the rest of the
# session, so Bluetooth headphones connect (battery, AVRCP) but produce no
# audio device at all -- and nothing in the UI explains why.
#
# Both services start at boot, and the user session usually wins by a second
# or two -- in practice bluetooth.service is already active by the time this
# runs, so the loop below resolves on its first check. A user unit can't
# order itself against a system unit, so this waits for one instead. Bounded
# at 3s (12 * 0.25s) rather than the 10s this started at: that was sized for
# a worst case that's never actually been hit, and there's no reason a
# genuinely broken Bluetooth stack should hold the audio session up for that
# long. It always exits 0 regardless -- a machine with no Bluetooth must not
# end up with no audio.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 12); do systemctl is-active --quiet bluetooth.service && break; sleep 0.25; done; exit 0'
