<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- UI and document text: Ubuntu everywhere -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Ubuntu Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Ubuntu Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Ubuntu Nerd Font</family></prefer>
  </alias>

  <!-- Code and terminals: UbuntuMono Nerd Font. One font that owns every
       glyph, so nothing is borrowed from a fallback at different metrics. -->
  <alias>
    <family>monospace</family>
    <prefer><family>UbuntuMono Nerd Font</family></prefer>
  </alias>
</fontconfig>
