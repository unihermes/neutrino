<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- UI and document text: Ubuntu everywhere -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Ubuntu Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Ubuntu Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Ubuntu Nerd Font</family></prefer>
  </alias>

  <!-- Code and terminals: ProggyVector -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>ProggyVector</family>
      <family>UbuntuMono Nerd Font</family>
    </prefer>
  </alias>

  <!-- ProggyVector has no Nerd Font icons, so fall back to UbuntuMono's -->
  <alias binding="same">
    <family>ProggyVector</family>
    <accept><family>UbuntuMono Nerd Font</family></accept>
  </alias>
</fontconfig>
