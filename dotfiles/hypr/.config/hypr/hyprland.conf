# Neutrino - Hyprland config
# ~/.config/hypr/hyprland.conf

# --- VMware virtual GPU ---------------------------------------------------
# Try starting without these first. If Hyprland exits immediately with a
# renderer or DRM error, uncomment them one block at a time.
# env = AQ_NO_ATOMIC,1
# env = WLR_RENDERER_ALLOW_SOFTWARE,1
# env = LIBGL_ALWAYS_SOFTWARE,1

# --- environment ---------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

# --- monitors ------------------------------------------------------------
# VMware reports a Virtual-1 output. `hyprctl monitors` on the real system.
monitor = , preferred, auto, 1

# --- autostart -----------------------------------------------------------
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = quickshell
exec-once = wl-paste --watch cliphist store

# --- input ---------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 8
    # Cheap on software rendering. Turn blur on once you are on real hardware.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    # Off by default: animations are painful under llvmpipe.
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
}

# --- keybinds ------------------------------------------------------------
$mod = SUPER
$term = alacritty
$files = thunar

bind = $mod, Return, exec, $term
bind = $mod, E, exec, $files
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,

# focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# audio + brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
