# Neutrino - Hyprland
# ~/.config/hypr/hyprland.conf
#
# grayscale ramp, shared with every other config in this repo:
#   #0b0b0b base   #121212 bar    #1a1a1a surface  #242424 overlay
#   #303030 border #4d4d4d muted  #7a7a7a subtext  #c2c2c2 text
#   #ebebeb bright

# --- environment ---------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

# --- monitors ------------------------------------------------------------
# Blank first field matches every output, which is what you want on a laptop
# that gets docked. `hyprctl monitors` for the real names when you need a rule
# per display.
monitor = , preferred, auto, 1

# --- autostart -----------------------------------------------------------
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = quickshell

# --- input ---------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 0.6
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    resize_on_border = true
    layout = dwindle
    col.active_border   = rgba(ebebebcc)
    col.inactive_border = rgba(303030aa)
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.96
    blur {
        enabled = true
        size = 6
        passes = 2
        noise = 0.015
        contrast = 0.9
        brightness = 0.7
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = quick, 0.22, 1, 0.36, 1
    animation = windows,     1, 3, quick, popin 92%
    animation = windowsOut,  1, 3, quick, popin 92%
    animation = border,      1, 6, quick
    animation = fade,        1, 3, quick
    animation = workspaces,  1, 4, quick, slidefade 12%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    focus_on_activate = true
}

# --- keybinds ------------------------------------------------------------
$mod = SUPER

# Binary names, not .desktop names. Verify them on the real system before
# trusting this file:  which alacritty thunar codium zen-browser floorp
$term   = alacritty
$files  = thunar
$code   = codium
$zen    = zen-browser
$floorp = floorp

# launchers
bind = $mod, Return, exec, $term
bind = $mod, A, exec, $term
bind = $mod, E, exec, $files
bind = $mod, V, exec, $code
bind = $mod, Z, exec, $zen
bind = $mod, F, exec, $floorp

# window management
# fullscreen and float moved to SHIFT, since plain F and V now launch apps.
bind = $mod, Q, killactive,
bind = $mod SHIFT, F, fullscreen,
bind = $mod SHIFT, V, togglefloating,
bind = $mod SHIFT, E, exit,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,

# focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# audio + brightness, the laptop function keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- window rules --------------------------------------------------------
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nwg-look)$
windowrule = size 900 600, class:^(pavucontrol)$
