# Neutrino - hyprlock
# ~/.config/hypr/hyprlock.conf
#
# hyprlock is its own binary with its own hyprlang config, so this keeps the
# old key=value format rather than the compositor's lua one.
#
# Same grayscale ramp as everything else: no hues, emphasis by lightness.
#   #0b0b0b base   #1a1a1a surface  #303030 border
#   #7a7a7a subtext #c2c2c2 text    #ebebeb bright

background {
    monitor =
    color = rgba(0b0b0bff)
}

input-field {
    monitor =
    size = 240, 44
    rounding = 3
    outline_thickness = 1
    outer_color = rgba(303030aa)
    inner_color = rgba(1a1a1aff)
    font_color = rgba(c2c2c2ff)
    # a wrong password is flagged by going bright, not by going red
    check_color = rgba(7a7a7aff)
    fail_color = rgba(ebebebff)
    placeholder_text =
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ebebebff)
    font_size = 42
    font_family = ProggyVector
    position = 0, 80
    halign = center
    valign = center
}
