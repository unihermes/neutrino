# Neutrino - hypridle
# ~/.config/hypr/hypridle.conf
#
# Idle ladder: dim -> lock -> screens off -> suspend. Started from
# hyprland.lua's autostart block.
#
# hypridle still reads hyprlang, not Lua -- only Hyprland itself moved to
# hyprland.lua, so this file keeps the old syntax.
#
# The bar's Quick Actions "Keep Awake" toggle holds a Wayland idle inhibitor,
# which stops every step below from firing. So does anything playing video
# in a browser (it asks over D-Bus, which hypridle honours by default).

general {
    # pidof guard: a second hyprlock on top of the first would need two
    # unlocks, and the lock step below can fire while one is already up
    lock_cmd = pidof hyprlock || hyprlock
    # lock before the lid closes or suspend lands, so the screen that comes
    # back on is already locked rather than flashing the desktop first
    before_sleep_cmd = loginctl lock-session
    # Plain `hyprctl dispatch dpms on` silently does nothing under the Lua
    # config -- dispatchers have to go through hl.dispatch via eval.
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))'
}

# 4 min: dim the panel as a warning. -s saves the current level so -r puts
# back exactly what you had, not a fixed value.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screens off. Any input brings them back.
listener {
    timeout = 330
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms("off"))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))'
}

# 20 min: suspend
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
